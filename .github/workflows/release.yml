name: Publish Windows Island
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: v2.0.3
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RUSTFLAGS: -C target-feature=+crt-static --remap-path-prefix=${{ github.workspace }}=Windows-Island
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and app version differ' }
      - name: Verify Mihomo detection
        shell: powershell
        run: |
          ./src/companion/Test-VpnStatus.ps1
          ./src/companion/Test-VpnTransport.ps1
      - run: cargo build --locked --release --bin daozai
      - name: Package verified portable update
        shell: pwsh
        run: ./scripts/package-island.ps1 -Executable ./target/release/daozai.exe
      - name: Package Windows setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          ./tests/native_installer.ps1 -NsisCompiler $compiler
          $setup = ./scripts/package-island-setup.ps1 -Executable ./target/release/daozai.exe -NsisCompiler $compiler
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $setup)" | Add-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = [regex]::Escape($env:RELEASE_TAG)
          $notes = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $tag [^\r\n]+\r?\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (!$notes) { throw 'Release notes are missing from CHANGELOG.md' }
          $notesFile = Join-Path $env:RUNNER_TEMP 'windows-island-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG dist/Windows-Island-v*-windows-x64.zip dist/Windows-Island-Setup-v*-windows-x64.exe dist/SHA256SUMS.txt --title "Windows Island $env:RELEASE_TAG" --notes-file $notesFile --verify-tag
