name: Publish Windows Island
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: v1.0.2
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RUSTFLAGS: -C target-feature=+crt-static --remap-path-prefix=${{ github.workspace }}=Windows-Island
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and app version differ' }
      - run: cargo build --locked --release --bin daozai
      - name: Package verified portable update
        shell: pwsh
        run: ./scripts/package-island.ps1 -Executable ./target/release/daozai.exe
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG dist/Windows-Island-v*-windows-x64.zip dist/SHA256SUMS.txt --title "Windows Island $env:RELEASE_TAG" --generate-notes
