name: Windows Island checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --features record
      - run: cargo test --locked --lib companion -- --test-threads=1
      - run: cargo test --locked --lib updates:: -- --test-threads=1
      - run: cargo test --locked --lib bar_layout::tests -- --test-threads=1
      - name: Update replacement and data preservation
        shell: pwsh
        run: ./tests/update_installer.ps1
